id: 2026-05-08-v2-baseline
basic_pitch:
  onset_threshold: 0.5
  frame_threshold: 0.3
  minimum_note_length_ms: 58
  minimum_frequency_hz: 32.7
  maximum_frequency_hz: 2000
post_processing:
  median_filter_window: 5
  min_note_duration_s: 0.05
  same_pitch_merge_gap_s: 0.05
  rhythmic_snap_confidence_threshold: 0.7
key_detection:
  hpss_margin: 1.0
  windowed_segment_length_s: 8.0
  windowed_hop_s: 2.0
beat_tracking:
  backend: madmom                        # RNN+DBN downbeats; falls back to librosa
  start_bpm: 120                         # librosa fallback only
  tightness: 100                         # librosa fallback only
chord_detection:
  backend: madmom_deep_chroma            # falls back to template_hmm
  qualities: [maj, min, maj7, min7, 7, dim, sus4, aug]
  min_segment_duration_s: 0.4
tab_assignment:
  weights:                               # coordinate-descent tuned on GuitarSet dev
    w_move: 0.5
    w_string: 0.15
    w_span: 0.5
    w_open: 0.05
    w_high: 1.6
    w_chord_intra: 0.3
  max_fret: 22
composition:
  notes_per_bar: 4
  strong_beat_chord_tone_prob: 0.7
  weak_beat_chord_tone_prob: 0.3
  markov_max_interval_semitones: 4
  velocity_strong: 80
  velocity_weak: 70
