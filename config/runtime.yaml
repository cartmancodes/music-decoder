# config/runtime.yaml
# Defaults assume macOS user data dir; override via MUSIC_DECODER_* env vars.
log_level: INFO
youtube_cache_dir: ~/Library/Application Support/music-decoder/yt_cache
composition_out_dir: ~/Library/Application Support/music-decoder/compositions
ffmpeg_path: null            # null = autodiscover via PATH
model_cache_dir: ~/Library/Caches/music-decoder/models
fixture_dir: tests/fixtures
