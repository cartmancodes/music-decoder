[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "music-decoder"
version = "0.1.0"
description = "Local music analysis tool: audio → key + guitar tablature."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
dependencies = [
  "streamlit>=1.32",
  "librosa>=0.10",
  "basic-pitch>=0.4",
  "demucs>=4.0",
  "madmom>=0.16",
  "pretty_midi>=0.2.10",
  "music21>=9.1",
  "mir_eval>=0.7",
  "pyfluidsynth>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26,<2.0",
  "scipy>=1.11",
  "pyyaml>=6.0",
  "click>=8.1",
  "yt-dlp>=2024.10.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.5",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
music-decoder = "music_decoder.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/music_decoder"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_any_generics = true
plugins = []

[[tool.mypy.overrides]]
module = ["basic_pitch.*", "demucs.*", "librosa.*", "pretty_midi.*",
          "music21.*", "mir_eval.*", "fluidsynth.*",
          "matplotlib.*", "scipy.*", "streamlit.*", "madmom.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "slow: tests that take >5s",
  "regression: regression tests against accuracy thresholds",
  "integration: cross-module integration tests",
]
